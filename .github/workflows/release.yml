name: Build & Release

# Build standalone binaries for Windows and Linux on GitHub's runners and attach
# them to a GitHub Release. Trigger by pushing a version tag:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# You can also run it manually from the Actions tab (workflow_dispatch) to get the
# binaries as build artifacts without creating a release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # needed to create/update the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: ubuntu-latest
            label: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executables
        run: pyinstaller --clean -y airthrow.spec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/airthrow.exe,dist/airthrow-gui.exe,dist/airthrow-tray.exe -DestinationPath airthrow-windows-x64.zip

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x dist/airthrow dist/airthrow-gui dist/airthrow-tray
          tar -czf airthrow-linux-x64.tar.gz -C dist airthrow airthrow-gui airthrow-tray

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: airthrow-${{ matrix.label }}
          path: |
            airthrow-windows-x64.zip
            airthrow-linux-x64.tar.gz
          if-no-files-found: ignore

      - name: Publish to Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          generate_release_notes: true
          files: |
            airthrow-windows-x64.zip
            airthrow-linux-x64.tar.gz
